limit_req_zone $binary_remote_addr zone=chat:10m rate=30r/m;

server {
    listen 80;
    server_name _;
    client_max_body_size 64k;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    root /usr/share/nginx/html;          # mock RMB page (web/)

    # The embeddable widget: the file RMB's TYPO3 page loads with one <script> tag
    location = /widget.js {
        alias /usr/share/nginx/widget/widget.js;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=300";
    }

    # Public API: only chat and health are exposed. The case API is internal (service key) and is NOT routed here.
    location = /api/v1/chat {
        limit_req zone=chat burst=10 nodelay;
        proxy_pass http://ai:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
    location = /api/v1/health {
        proxy_pass http://ai:8000;
    }

    # Admin portal (PHP case service). In production restrict by network and enforce HTTPS.
    location /admin {
        proxy_pass http://case:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        add_header X-Frame-Options DENY always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
